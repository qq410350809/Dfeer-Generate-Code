<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outside: Two compact semi-circular arrows with smaller vertical gap (Radius = 11.5px) -->
  <!-- Top semi-circle arrow (left to right, clockwise, perfectly on circle R=11.5) -->
  <path d="M 9.5 14.5 A 11.5 11.5 0 0 1 30.5 14.5" stroke="url(#loop_grad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Symmetrical arrowhead aligned with the top-right tangent, with inner wing flared inwards -->
  <path d="M 27 12.5 L 30.5 14.5 L 30.5 10.5" stroke="url(#loop_grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom semi-circle arrow (right to left, clockwise, perfectly on circle R=11.5) -->
  <path d="M 30.5 25.5 A 11.5 11.5 0 0 1 9.5 25.5" stroke="url(#loop_grad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Symmetrical arrowhead aligned with the bottom-left tangent, with inner wing flared inwards -->
  <path d="M 13 27.5 L 9.5 25.5 L 9.5 29.5" stroke="url(#loop_grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inside Upper Half: Small Database Cylinder -->
  <ellipse cx="20" cy="13.5" rx="3.5" ry="1.2" fill="#3BEA62"/>
  <path d="M16.5 13.5V15.5C16.5 16.2 18 16.8 20 16.8C22 16.8 23.5 16.2 23.5 15.5V13.5" fill="#3C99CC"/>
  <path d="M16.5 15.5V17.5C16.5 18.2 18 18.8 20 18.8C22 18.8 23.5 18.2 23.5 17.5V15.5" fill="#3C99CC" opacity="0.8"/>

  <!-- Inside Lower Half: Small Code Icon (</>) -->
  <!-- `<` -->
  <path d="M 17.5 24.5 L 16.5 25.5 L 17.5 26.5" stroke="#6B57FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- `/` -->
  <path d="M 20.5 24.5 L 19.5 28.5" stroke="#6B57FF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- `>` -->
  <path d="M 22.5 24.5 L 23.5 25.5 L 22.5 26.5" stroke="#6B57FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <defs>
    <linearGradient id="loop_grad" x1="5" y1="5" x2="35" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0.15937" stop-color="#3BEA62"/>
      <stop offset="0.5404" stop-color="#3C99CC"/>
      <stop offset="0.93739" stop-color="#6B57FF"/>
    </linearGradient>
  </defs>
</svg>
